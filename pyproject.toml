[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intopt-py"
version = "0.1.0"
description = "Intelligent Optimization Algorithm"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yanrui Liu", email = "rockyrliu@qq.com"},]
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "tqdm>=4.69.1",
]

[tool.hatch.build.targets.wheel]
packages = ["intopt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
